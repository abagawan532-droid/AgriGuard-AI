<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Sunlight Halo -->
  <circle cx="200" cy="130" r="140" fill="#8b5cf6" opacity="0.12" filter="url(#shadow)"/>

  <!-- Soil Ground Bed -->
  <ellipse cx="200" cy="370" rx="170" ry="30" fill="url(#soilGrad)"/>
  <ellipse cx="200" cy="365" rx="150" ry="12" fill="#15803d" opacity="0.35"/>

  <!-- Botanical Tree Geometry -->
  <g filter="url(#shadow)">
    
        <!-- Aerial Prop Roots -->
        <line x1="120" y1="210" x2="115" y2="360" stroke="#52525b" stroke-width="4" stroke-linecap="round"/>
        <line x1="150" y1="220" x2="148" y2="360" stroke="#52525b" stroke-width="3"/>
        <line x1="280" y1="210" x2="285" y2="360" stroke="#52525b" stroke-width="4" stroke-linecap="round"/>
        <line x1="250" y1="220" x2="252" y2="360" stroke="#52525b" stroke-width="3"/>
        <!-- Central Trunk -->
        <path d="M 180 230 Q 185 300 170 360 L 230 360 Q 215 300 220 230 Z" fill="#52525b"/>
        <!-- Massive Spreading Canopy -->
        <ellipse cx="200" cy="150" rx="140" ry="85" fill="#15803d" opacity="0.95"/>
        <ellipse cx="140" cy="140" rx="70" ry="55" fill="#22c55e" opacity="0.9"/>
        <ellipse cx="260" cy="140" rx="70" ry="55" fill="#22c55e" opacity="0.9"/>
        <ellipse cx="200" cy="115" rx="90" ry="60" fill="#22c55e"/>
        
  </g>

  <!-- Category & Species Header Pill -->
  <g transform="translate(18, 20)">
    <rect width="130" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="65" y="17" fill="#ffffff" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
      SACRED • #2
    </text>
  </g>

  <!-- Carbon Absorption Badge -->
  <g transform="translate(262, 20)">
    <rect width="120" height="26" rx="13" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
    <text x="60" y="17" fill="#34d399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
      🌱 48.0 kg CO₂/yr
    </text>
  </g>

  <!-- Bottom Botanical Label Panel -->
  <rect x="16" y="390" width="368" height="74" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)"/>
  
  <text x="32" y="418" fill="#ffffff" font-size="18" font-weight="800" font-family="system-ui, -apple-system, sans-serif">
    🌳 Banyan
  </text>
  
  <text x="32" y="438" fill="#8b5cf6" font-size="12" font-style="italic" font-weight="600" font-family="system-ui, -apple-system, sans-serif">
    Ficus benghalensis
  </text>
  
  <text x="32" y="454" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">
    Family: Moraceae
  </text>
</svg>